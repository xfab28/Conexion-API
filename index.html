<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conexion API</title>
</head>
<body>
    <div class="contenido">

        <h1>Buscador de Usuarios</h1>

        <div class="inputs">
            <input type="text" name="usuarios" id="busqueda" placeholder="Introduce un ID (1-10)">
            <button id="btn-buscar">Buscar</button>
        </div>

    </div>

    <div class="informacion">
        <p>Nombre: <span id="name"></span></p>
        <p>Usuario: <span id="user"></span></p>
        <p>Correo Electrónico: <span id="email"></span></p>
        <p>Ciudad: <span id="city"></span></p>
    </div>

    <div class="mensaje"></div>

    <script src="script.js"></script>
</body>
</html>
